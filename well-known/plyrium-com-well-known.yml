description: >-
  Results of probing the /.well-known/ discovery surface on every host this record knows: the registrable
  domain and www, the VouchSpec API host (apis[].baseURL and the OpenAPI servers[] host, which is also the
  MCP server host and the A2A host), the demo/console host, and the published test sandbox host. Status is
  the HTTP code observed at fetch time on 2026-09-19. Only documents that returned a real, correctly-typed
  payload were saved verbatim. Three hosts have catch-all behaviour that is NOT a document and is recorded
  as a miss - vouchspec.plyrium.com 308s every unknown path to /api/vouchspec/v1/discovery (a JSON contract,
  not the requested well-known document); www.plyrium.com and demo.plyrium.com 307 every unknown path to
  /login; vouchspec-sandbox.plyrium.com answers 401 with an HTML shell for everything except its discovery
  and health routes. No security.txt, OIDC, OAuth authorization-server or protected-resource metadata is
  served on any host - the API is anonymous-read plus x402-paid, so there is no OAuth surface to describe.
  A parsing AI Catalog (ARD), an x402 manifest, an Agent Skill index and an OpenAPI alias ARE served on the
  VouchSpec host, alongside the A2A agent card recorded in a2a/.
