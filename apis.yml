apis:
- aid: plyrium-com:vouchspec-agent-skill-evidence-api
  name: VouchSpec Agent Skill Evidence API
  description: >-
    Agent-only API for purchasing fresh, isolated static validation and signed evidence for one exact
    immutable public GitHub Agent Skill commit. Free anonymous discovery and verification operations
    (health, discovery, x402 manifest, issuer key, immutable DSSE receipt bytes, live receipt status) plus
    one x402-paid purchase operation settling 0.25 USDC on Base mainnet (eip155:8453). No human checkout,
    no uploads, no private repositories; artifact code is never executed.
