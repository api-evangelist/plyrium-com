aid: plyrium-com
name: Plyrium
description: >-
  Plyrium is a contractor operating system for home-service businesses (HVAC, plumbing, electrical,
  roofing) built in Coolidge, Arizona - AI phone answering, scheduling, quotes, invoicing with Stripe
  payments and Google Business Profile automation. Its public API surface is VouchSpec, an agent-only
  service on vouchspec.plyrium.com that sells fresh static validation and Ed25519-signed DSSE evidence
  for one exact public GitHub Agent Skill commit, paid per request in USDC over x402 on Base, and
  discoverable through an OpenAPI 3.1 contract, llms.txt, an A2A agent card, a remote MCP server, an
  installable Agent Skill and an ARD ai-catalog.
